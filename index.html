<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#132329">
  <meta name="description" content="Baper Rasta — a Bangladeshi rickshaw life simulator.">
  <title>Baper Rasta — বাপের রাস্তা</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script defer src="./src/game.js"></script>
</head>
<body>
<main id="game-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">BR</span><div><strong>BAPER RASTA</strong><small>বাপের রাস্তা · রিকশাওয়ালা মামার জীবন</small></div></div>
    <div class="hud">
      <div class="stat"><small>ক্যাশ</small><b id="cash">৳ ৫০</b></div>
      <div class="stat"><small>ব্যাটারি</small><b id="battery">১০০%</b></div>
      <div class="stat"><small>খাবার</small><b id="food">৭০%</b></div><div class="stat"><small>পরিবার</small><b id="family">১০০%</b></div><div class="stat"><small>দিন</small><b id="day">১</b></div>
    </div>
  </header>
  <section id="game-container" aria-label="Baper Rasta game world">
    <div id="loading">শহর তৈরি হচ্ছে...</div>
    <div class="mission"><i></i><span id="mission-text">মামা, হলুদ চিহ্নের কাছে গিয়ে যাত্রী নিন।</span></div>
    <div class="world-tag">ঢাকা শহর <span>•</span> পুরান ঢাকা</div>
    <div class="wanted" id="wanted" hidden>🚨 WANTED <b id="wanted-level">★</b></div>
    <div class="controls">
      <div class="dpad">
        <button class="control up" data-key="up" aria-label="উপরে">▲</button>
        <button class="control left" data-key="left" aria-label="বামে">◀</button>
        <button class="control down" data-key="down" aria-label="নিচে">▼</button>
        <button class="control right" data-key="right" aria-label="ডানে">▶</button>
      </div>
      <div class="right-controls">
        <button class="horn" id="horn-button" aria-label="হর্ন">🔔<small>হর্ন</small></button>
        <button class="action" id="action-button">কাজ করুন</button>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
  <footer><span>DEMO 02 · DHAKA CITY</span><span>WASD / ARROW KEYS · SPACE = INTERACT</span><button id="reset-button">নতুন করে শুরু</button></footer>
</main>
</body>
</html>
